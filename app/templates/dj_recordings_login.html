<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DJ Recording Archive</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="card shadow-sm mx-auto" style="max-width:430px"><div class="card-body p-4"><h1 class="h3">DJ Recording Archive</h1><p class="text-muted">Enter the four-digit code provided by station management.</p>{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<form method="post"><label for="code" class="form-label">Access code</label><input id="code" name="code" class="form-control form-control-lg text-center" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code" required autofocus><button class="btn btn-primary w-100 mt-3" type="submit">Continue</button></form><p class="small text-muted mt-3 mb-0">Codes may expire or be revoked by station management.</p></div></div></main></body></html>
